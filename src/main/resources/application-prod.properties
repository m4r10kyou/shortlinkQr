spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

shortlink.base-url=${SHORTLINK_BASE_URL}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Render terminates TLS and forwards. NATIVE uses Tomcat's RemoteIpValve, which
# honours X-Forwarded-For only when the immediate peer is a private-range proxy,
# so getRemoteAddr() returns the real client and a forged header from outside
# does not. The value still has to be verified against the deploy logs.
server.forward-headers-strategy=native