spring.application.name=shortlinkQr
server.port=9080
spring.datasource.url=jdbc:h2:file:./data/shortlink;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.jpa.open-in-view=false
shortlink.generator.max-retries=3
shortlink.base-url=${SHORTLINK_BASE_URL:http://localhost:9080}
logging.file.name=logs/shortlinkQr.log
shortlink.qr.size=512

# Multipart limits - enforced by the servlet container, before the controller runs
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# Logo constraints - enforced by the application
shortlink.logo.max-upload-bytes=1048576
shortlink.logo.max-stored-bytes=4194304
shortlink.logo.max-dimension=2000
shortlink.logo.min-dimension=32