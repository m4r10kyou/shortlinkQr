version:  2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
        interval: "weekly"
        day: "monday"
        time: "06:00"
        timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
      
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    ignore:
      # Non-LTS Java lines. 21 and 25 are LTS, 29 is the next one.
      - dependency-name: "eclipse-temurin"
        versions: ["22", "23", "24"]
      
