version:  2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
        interval: "weekly"
        day: "monday"
        time: "06:00"
        timezone: "Europe/Madrid"
    open-pull-request-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-request-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
